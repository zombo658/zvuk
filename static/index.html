<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zvuk — громкость системы</title>
<style>
  :root {
    --bg1: #14042b;
    --bg2: #2a0a5e;
    --card: rgba(255, 255, 255, 0.06);
    --border: rgba(196, 148, 255, 0.25);
    --violet: #a855f7;
    --violet-soft: #c084fc;
    --magenta: #e879f9;
    --text: #f3e8ff;
    --muted: #b79ed9;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    background:
      radial-gradient(60rem 40rem at 15% -10%, rgba(168, 85, 247, .28), transparent 60%),
      radial-gradient(50rem 35rem at 110% 110%, rgba(232, 121, 249, .18), transparent 60%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    padding: 1.5rem;
  }
  .card {
    width: 100%;
    max-width: 26rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 1.5rem;
    padding: 2rem;
    backdrop-filter: blur(14px);
    box-shadow: 0 25px 60px rgba(0, 0, 0, .45);
    text-align: center;
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--violet-soft);
  }
  .sub { font-size: .8rem; color: var(--muted); margin-top: .3rem; }

  .value {
    font-size: 4.5rem;
    font-weight: 700;
    line-height: 1.1;
    margin: 1.4rem 0 .2rem;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(90deg, var(--violet-soft), var(--magenta));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .boost {
    display: inline-block;
    font-size: .75rem;
    font-weight: 600;
    letter-spacing: .08em;
    color: var(--magenta);
    border: 1px solid rgba(232, 121, 249, .5);
    border-radius: 999px;
    padding: .2rem .7rem;
    margin-bottom: 1rem;
    visibility: hidden;
  }
  .boost.on { visibility: visible; }

  .slider-wrap { position: relative; margin: 1rem 0 .4rem; }
  input[type="range"] {
    width: 100%;
    height: .6rem;
    appearance: none;
    -webkit-appearance: none;
    border-radius: 999px;
    outline: none;
    background: linear-gradient(90deg,
      var(--violet) 0%,
      var(--magenta) 33.3%,
      rgba(255, 255, 255, .12) 33.3%,
      rgba(255, 255, 255, .12) 100%);
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;
    width: 1.6rem;
    height: 1.6rem;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--violet-soft) 55%, var(--violet));
    border: none;
    box-shadow: 0 0 0 5px rgba(168, 85, 247, .25), 0 4px 14px rgba(0, 0, 0, .5);
  }
  input[type="range"]::-moz-range-thumb {
    width: 1.6rem;
    height: 1.6rem;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--violet-soft) 55%, var(--violet));
    border: none;
    box-shadow: 0 0 0 5px rgba(168, 85, 247, .25), 0 4px 14px rgba(0, 0, 0, .5);
  }
  .ticks {
    display: flex;
    justify-content: space-between;
    font-size: .7rem;
    color: var(--muted);
    margin-top: .45rem;
  }

  .row { display: flex; gap: .6rem; margin-top: 1.3rem; }
  button {
    flex: 1;
    padding: .7rem 0;
    font-size: .95rem;
    font-weight: 600;
    color: var(--text);
    background: rgba(168, 85, 247, .16);
    border: 1px solid var(--border);
    border-radius: .8rem;
    cursor: pointer;
    transition: background .15s, transform .05s;
  }
  button:hover { background: rgba(168, 85, 247, .32); }
  button:active { transform: scale(.97); }
  button.primary {
    background: linear-gradient(90deg, var(--violet), var(--magenta));
    border: none;
  }
  button.primary:hover { filter: brightness(1.12); }

  .presets { display: flex; gap: .6rem; margin-top: .6rem; }
  .presets button { font-size: .85rem; padding: .55rem 0; }

  .status { margin-top: 1.3rem; font-size: .75rem; color: var(--muted); min-height: 1rem; }
  .status .err { color: #fda4af; }
</style>
</head>
<body>
  <main class="card">
    <h1>Zvuk</h1>
    <div class="sub">громкость всей системы · максимум 300%</div>

    <div class="value" id="value">—</div>
    <div class="boost" id="boost">⚡ усиление &gt;100%</div>

    <div class="slider-wrap">
      <input type="range" id="slider" min="0" max="300" step="1" value="0"
             aria-label="Громкость в процентах">
      <div class="ticks"><span>0%</span><span>100%</span><span>200%</span><span>300%</span></div>
    </div>

    <div class="row">
      <button id="down">− 10</button>
      <button id="up" class="primary">+ 10</button>
    </div>
    <div class="presets">
      <button data-set="0">0%</button>
      <button data-set="50">50%</button>
      <button data-set="100">100%</button>
      <button data-set="300">300%</button>
    </div>

    <div class="status" id="status"></div>
  </main>

<script>
  const $ = (id) => document.getElementById(id);
  const slider = $("slider");
  let maxVolume = 300;
  let dragging = false;

  function render(state) {
    maxVolume = state.max;
    slider.max = maxVolume;
    if (!dragging) slider.value = state.volume;
    $("value").textContent = state.volume + "%";
    $("boost").classList.toggle("on", state.volume > 100);
    // закрашенная часть трека
    const filled = (state.volume / maxVolume) * 100;
    slider.style.background = `linear-gradient(90deg,
      var(--violet) 0%, var(--magenta) ${filled}%,
      rgba(255,255,255,.12) ${filled}%, rgba(255,255,255,.12) 100%)`;
    $("status").innerHTML = state.backend === "demo"
      ? "демо-режим: звуковая подсистема на сервере не найдена"
      : "бэкенд: " + state.backend;
  }

  function fail(err) {
    $("status").innerHTML = '<span class="err">ошибка: ' + err + "</span>";
  }

  async function api(method, body) {
    try {
      const res = await fetch("/api/volume", {
        method,
        headers: body ? { "Content-Type": "application/json" } : {},
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.status);
      render(data);
    } catch (e) {
      fail(e.message);
    }
  }

  const refresh = () => api("GET");
  const setVolume = (v) => api("POST", { volume: v });
  const change = (d) => api("POST", { delta: d });

  $("up").onclick = () => change(10);
  $("down").onclick = () => change(-10);
  document.querySelectorAll(".presets button").forEach((b) => {
    b.onclick = () => setVolume(+b.dataset.set);
  });

  // во время перетаскивания показываем число сразу, на сервер шлём отпуская
  slider.addEventListener("input", () => {
    dragging = true;
    $("value").textContent = slider.value + "%";
    $("boost").classList.toggle("on", +slider.value > 100);
  });
  slider.addEventListener("change", () => {
    dragging = false;
    setVolume(+slider.value);
  });

  refresh();
  setInterval(() => { if (!dragging) refresh(); }, 2000);
</script>
</body>
</html>
